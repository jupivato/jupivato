<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="100%" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      .robot { animation: float 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Terminal Window -->
  <rect x="1" y="1" width="858" height="278" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Title Bar -->
  <path d="M 1 15 Q 1 1 15 1 L 845 1 Q 859 1 859 15 L 859 38 L 1 38 Z" fill="#0f172a" />
  <line x1="1" y1="38" x2="859" y2="38" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="24" cy="20" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="44" cy="20" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="64" cy="20" r="6" fill="#10b981" opacity="0.85" />
  <text x="430" y="24" text-anchor="middle" fill="#64748b" font-size="13" class="mono">julia@cerv-lab:~/profile — bash</text>

  <!-- Left Content: Terminal Text -->
  <text x="34" y="76" fill="#2dd4bf" font-size="14" class="mono">$ whoami</text>
  <text x="34" y="116" fill="#f8fafc" font-size="34" font-weight="700" class="sans">Júlia Pivato</text>
  <rect x="34" y="128" width="140" height="3" rx="1.5" fill="url(#accent)" />

  <text x="34" y="160" fill="#cbd5e1" font-size="15.5" class="sans">Engineering Double Degree  ·  UNIFEI (Brazil) &amp; ENIB (France)</text>
  <text x="34" y="184" fill="#94a3b8" font-size="14.5" class="sans">Research @ CERV — Centre Européen de Réalité Virtuelle</text>

  <text x="34" y="224" fill="#2dd4bf" font-size="14" class="mono">$ cat stack.txt</text>
  <text x="34" y="248" fill="#e2e8f0" font-size="14.5" class="mono">Python  |  ROS  |  Gazebo  |  LIMO Robot  |  C++  |  Java  |  TS</text>
  <rect x="576" y="235" width="9" height="16" fill="#38bdf8" class="cursor" />

  <!-- Right Side: Pixel Art LIMO-style Rover & Stars -->
  <g transform="translate(650, 68)">
    <!-- Subtle pixel stars -->
    <rect x="18" y="12" width="4" height="4" fill="#38bdf8" opacity="0.6" />
    <rect x="148" y="8" width="4" height="4" fill="#2dd4bf" opacity="0.5" />
    <rect x="164" y="42" width="4" height="4" fill="#64748b" opacity="0.6" />
    <rect x="6" y="64" width="4" height="4" fill="#64748b" opacity="0.5" />

    <!-- Pixel Robot (floating) -->
    <g class="robot" shape-rendering="crispEdges">
      <!-- Antenna -->
      <rect x="86" y="18" width="6" height="6" fill="#38bdf8" />
      <rect x="86" y="24" width="6" height="12" fill="#64748b" />

      <!-- LiDAR / Sensor Dome -->
      <rect x="68" y="36" width="42" height="12" fill="#334155" />
      <rect x="74" y="39" width="30" height="6" fill="#0f172a" />
      <rect x="80" y="40" width="18" height="4" fill="#2dd4bf" />

      <!-- Main Chassis -->
      <rect x="44" y="48" width="90" height="48" fill="#1e293b" />
      <rect x="50" y="48" width="78" height="6" fill="#334155" />
      <rect x="44" y="90" width="90" height="6" fill="#0f172a" />

      <!-- Screen / Face -->
      <rect x="56" y="58" width="66" height="28" fill="#0b1120" />
      <!-- Eyes -->
      <rect x="68" y="66" width="10" height="10" fill="#38bdf8" />
      <rect x="100" y="66" width="10" height="10" fill="#38bdf8" />
      <!-- Cute pixel smile -->
      <rect x="82" y="78" width="14" height="4" fill="#2dd4bf" />

      <!-- Wheels (4-wheel rover look) -->
      <rect x="38" y="96" width="24" height="22" fill="#0f172a" />
      <rect x="42" y="100" width="16" height="14" fill="#475569" />
      <rect x="47" y="105" width="6" height="4" fill="#94a3b8" />

      <rect x="116" y="96" width="24" height="22" fill="#0f172a" />
      <rect x="120" y="100" width="16" height="14" fill="#475569" />
      <rect x="125" y="105" width="6" height="4" fill="#94a3b8" />
    </g>

    <!-- Ground shadow -->
    <rect x="42" y="132" width="94" height="6" rx="3" fill="#020617" opacity="0.65" />
    <text x="89" y="156" text-anchor="middle" fill="#64748b" font-size="11" class="mono">limo_sim :: ready</text>
  </g>
</svg>