      <line x1="22" y1="7" x2="22" y2="15" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="82" y="38" fill="#f8fafc" font-size="17" font-weight="700" class="sans">UNIFEI</text>
    <text x="82" y="58" fill="#94a3b8" font-size="13.5" class="sans">B.Sc. in Computer Engineering · Brazil</text>
    <text x="20" y="92" fill="#64748b" font-size="12.5" class="mono">2022 – 2026  |  Algorithms TA · SBC Regional Gold</text>
  </g>

