      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <!-- Card 1: UNIFEI (Graduation Cap Icon) -->
  <g transform="translate(2, 2)">
    <rect width="420" height="114" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <rect x="20" y="22" width="46" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <g transform="translate(31, 33)">
